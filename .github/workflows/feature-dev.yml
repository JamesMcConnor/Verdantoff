# Feature development pipeline
name: Build and deploy to Development

on:
  push:
    branches:
      - "Feature/webrtc-react-amended-app"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REACT_APP_FIREBASE_apiKey: ${{ secrets.VUE_APP_FIREBASE_API_KEY }}
      REACT_APP_FIREBASE_authDomain: ${{ secrets.VUE_APP_FIREBASE_AUTH_DOMAIN }}
      REACT_APP_FIREBASE_projectId: ${{ secrets.VUE_APP_FIREBASE_PROJECT_ID }}
      REACT_APP_FIREBASE_storageBucket: ${{ secrets.VUE_APP_FIREBASE_STORAGE_BUCKET }}
      REACT_APP_FIREBASE_messagingSenderId: ${{ secrets.VUE_APP_FIREBASE_MESSAGING_SENDER_ID }}
      REACT_APP_FIREBASE_appId: ${{ secrets.VUE_APP_FIREBASE_APP_ID }}
      REACT_APP_FIREBASE_databaseURL: ${{ secrets.VUE_APP_FIREBASE_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ./build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./build

      - name: Deploy with rsync
        run: rsync -avz ./build/ ${{ secrets.SSH_DEV_USER }}@${{ secrets.SSH_HOST }}:public/
